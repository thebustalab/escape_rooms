<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Noatak Dossier — CHEM 5725 (hub-and-spoke trial)</title>
  <!-- Phase 2 borrows the Alaska stylesheet for the shell; the map + overlay are here.
       Phase 3 swaps .map-bg for generated art. -->
  <link rel="stylesheet" href="../alaska/style.css" />
  <style>
    /* ----- the explorable mist map ----- */
    .map-wrap { position: relative; }
    #node-map.map {
      position: relative; width: 100%; aspect-ratio: 3 / 2;
      border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .map .map-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      /* Fallback gradient shows until/if the scene image loads. */
      background-color: #0c2029;
      background-image:
        radial-gradient(120% 90% at 50% 40%, #21414c 0%, #16303a 45%, #0c2029 100%);
    }
    .map .map-ribbons, .map .map-fog { position: absolute; inset: 0; pointer-events: none; }
    .map .map-ribbons { width: 100%; height: 100%; }
    .map .map-nodes { position: absolute; inset: 0; }
    .map .map-progress {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
      padding: 0.5rem 0.8rem; font-size: 0.85rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.55));
      pointer-events: none;
    }

    .ribbon {
      fill: none; stroke: rgba(255, 210, 120, 0.35); stroke-width: 1.5;
      vector-effect: non-scaling-stroke; stroke-linecap: round;
      stroke-dasharray: 100; stroke-dashoffset: 100;
      transition: stroke-dashoffset 1.1s ease, stroke 0.6s ease;
    }
    .ribbon.drawn { stroke-dashoffset: 0; }
    .map-ribbons.boss-open .ribbon.drawn { stroke: rgba(255, 210, 120, 0.7); }

    .map-node {
      position: absolute; transform: translate(-50%, -50%); z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      background: none; border: 0; color: inherit; font: inherit;
      cursor: pointer; width: 7.5rem; text-align: center;
      transition: opacity 0.5s ease, transform 0.15s ease;
    }
    .map-node .marker-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: rgba(210, 235, 245, 0.9);
      box-shadow: 0 0 12px 3px rgba(180, 225, 245, 0.45);
    }
    .map-node .marker-label { font-size: 0.78rem; line-height: 1.15; font-weight: 600; }
    .map-node .marker-state { font-size: 0.66rem; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.7; }
    .map-node.open:hover { transform: translate(-50%, -50%) scale(1.06); }
    .map-node.resolved .marker-dot { background: #7edc96; box-shadow: 0 0 12px 3px rgba(126, 220, 150, 0.5); }
    .map-node.resolved .marker-state { color: #7edc96; }

    .map-node.boss { width: 8.5rem; }
    .map-node.boss .marker-dot {
      width: 22px; height: 22px; background: rgba(255, 210, 120, 0.95);
      box-shadow: 0 0 18px 5px rgba(255, 200, 110, 0.55);
    }
    .map-node.boss.locked { opacity: 0; pointer-events: none; } /* hidden in the mist */
    .map-node.boss.ready .marker-dot { animation: bosspulse 1.6s ease-in-out infinite; }
    @keyframes bosspulse {
      0%, 100% { box-shadow: 0 0 16px 4px rgba(255, 200, 110, 0.45); }
      50%      { box-shadow: 0 0 26px 8px rgba(255, 200, 110, 0.75); }
    }

    /* ----- scene mode: markers become hotspots on painted objects ----- */
    .map.scene .map-node { width: auto; }
    .map.scene .map-node .marker-dot {
      width: 26px; height: 26px; background: rgba(255, 220, 150, 0.14);
      border: 2px solid rgba(255, 235, 190, 0.9);
      box-shadow: 0 0 16px 4px rgba(255, 210, 130, 0.4);
      animation: hotspot 1.9s ease-in-out infinite;
    }
    .map.scene .map-node .marker-state { display: none; }
    .map.scene .map-node .marker-label {
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      margin-top: 5px; white-space: nowrap; opacity: 0; pointer-events: none;
      background: rgba(0, 0, 0, 0.7); padding: 2px 7px; border-radius: 5px;
      font-size: 0.72rem; transition: opacity 0.15s ease;
    }
    .map.scene .map-node:hover .marker-label { opacity: 1; }
    .map.scene .map-node.resolved .marker-dot {
      border-color: #7edc96; background: rgba(126, 220, 150, 0.18);
      box-shadow: 0 0 16px 4px rgba(126, 220, 150, 0.45); animation: none;
    }
    .map.scene .map-node.boss.locked { opacity: 0; pointer-events: none; }
    .map.scene .map-node.boss .marker-dot { width: 30px; height: 30px; }
    @keyframes hotspot {
      0%, 100% { box-shadow: 0 0 14px 3px rgba(255, 210, 130, 0.35); }
      50%      { box-shadow: 0 0 22px 6px rgba(255, 210, 130, 0.62); }
    }

    /* ----- detail overlay over the map ----- */
    #node-detail.node-detail {
      position: absolute; inset: 0; z-index: 5; display: none;
      overflow: auto; padding: 1rem;
      background: rgba(8, 16, 22, 0.94);
      border-radius: 14px;
    }
    #node-detail.node-detail.open { display: block; }
    .detail-back {
      background: none; border: 0; color: inherit; font: inherit;
      opacity: 0.75; cursor: pointer; margin-bottom: 0.6rem; padding: 0;
    }
    .detail-back:hover { opacity: 1; }
    .boss-card .figure-spec { margin: 0.6rem 0; padding: 0.6rem 0.8rem; border-left: 3px solid rgba(255, 210, 120, 0.7); background: rgba(255, 210, 120, 0.08); border-radius: 6px; }
    .boss-card .boss-placeholder { margin: 0.6rem 0 0.9rem; font-size: 0.9rem; opacity: 0.85; }
  </style>
</head>
<body>

  <!-- ===== Screen 1: the story ===== -->
  <section id="screen1" class="screen active">
    <div class="scene">
      <img id="scene-image" alt="" />
      <div class="scene-overlay">
        <div class="tagline" id="scenario-title">…</div>
        <h1 id="scene-heading">…</h1>
        <div id="scene-story" class="story"></div>

        <div class="entry">
          <label for="student-id">Your x500</label>
          <input id="student-id" type="text" autocomplete="off"
                 placeholder="e.g. bust0037" />
          <button id="enter-btn" class="primary">Enter →</button>
          <div id="id-error" class="error"></div>
        </div>
      </div>
    </div>
  </section>

  <audio id="ambience" preload="none"></audio>
  <button id="music-toggle" class="music-toggle">♪ on</button>

  <!-- ===== Screen 2: the workroom ===== -->
  <section id="screen2" class="screen">
    <div id="screen2-bg" class="screen2-bg"></div>
    <header class="workroom-header">
      <span class="dot"></span> Search &amp; Rescue — case room
    </header>

    <div class="workroom">
      <div class="left">
        <div id="briefing" class="briefing"></div>

        <div class="console">
          <div id="paste-banner" class="paste-banner">
            <span>Pasting a big chunk? Make sure you're not shortcutting your own
            learning — you'll remember this far better if you type it. (You can
            still paste.)</span>
            <button id="paste-dismiss">Got it</button>
          </div>
          <div class="console-label">R console</div>
          <textarea id="code-input" spellcheck="false"></textarea>
          <div class="console-bar">
            <button id="run-btn" class="primary">Run</button>
            <span id="webr-status" class="status">Loading…</span>
          </div>
          <div id="webr-output" class="output"></div>
        </div>
      </div>

      <div class="right">
        <h2>The dossier</h2>
        <div class="map-wrap">
          <div id="node-map" class="map"></div>
          <div id="node-detail" class="node-detail"></div>
        </div>

        <div id="finish" class="finish">
          <h3>Case closed</h3>
          <div id="finish-body"></div>
          <div class="code-box">
            <div id="final-code" class="code">…</div>
            <button id="copy-code" class="primary">Copy code</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="../shared/codec.js"></script>
  <script src="scenario.js"></script>
  <script type="module" src="../shared/escape-engine.js"></script>
</body>
</html>
