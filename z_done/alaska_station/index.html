<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal in the Cold — The Station (CHEM 5725)</title>
  <link rel="stylesheet" href="../alaska/style.css" />
  <style>
    /* ----- full-screen pannable scene -----
       Selector is #screen2-scoped so it out-specifies the base rule
       `#screen2 > *:not(.screen2-bg) { position: relative }`, which would
       otherwise force this back to relative and collapse it to zero height. */
    #screen2 .map-wrap.fullscreen { position: fixed; inset: 0; z-index: 5; }
    #node-map.map {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border-radius: 0; border: 0; overflow: hidden;
    }
    .pano-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      background-color: #0c2029; transition: background-image 0.35s ease;
    }
    .pano-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
      width: 3rem; height: 3rem; border-radius: 50%;
      border: 0; cursor: pointer; font-size: 1.7rem; line-height: 1;
      color: #10202a; background: rgba(240, 245, 250, 0.85);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }
    .pano-arrow:hover { background: #fff; }
    .pano-arrow.left { left: 1rem; }
    .pano-arrow.right { right: 1rem; }

    .pano-artifacts { position: absolute; inset: 0; z-index: 2; }
    .artifact {
      position: absolute; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
      background: none; border: 0; color: inherit; font: inherit; cursor: pointer;
    }
    .artifact .artifact-dot {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255, 220, 150, 0.16);
      border: 2px solid rgba(255, 235, 190, 0.92);
      box-shadow: 0 0 18px 5px rgba(255, 210, 130, 0.45);
      animation: apulse 1.9s ease-in-out infinite;
    }
    .artifact.clue .artifact-dot {
      background: rgba(150, 210, 255, 0.16); border-color: rgba(180, 225, 255, 0.92);
      box-shadow: 0 0 16px 4px rgba(150, 205, 255, 0.45);
    }
    .artifact.solved .artifact-dot {
      background: rgba(126, 220, 150, 0.2); border-color: #7edc96;
      box-shadow: 0 0 16px 4px rgba(126, 220, 150, 0.5); animation: none;
    }
    .artifact .artifact-label {
      opacity: 0; white-space: nowrap; font-size: 0.78rem;
      background: rgba(0, 0, 0, 0.72); padding: 3px 8px; border-radius: 5px;
      transition: opacity 0.15s ease;
    }
    .artifact:hover .artifact-label { opacity: 1; }
    @keyframes apulse {
      0%, 100% { box-shadow: 0 0 16px 4px rgba(255, 210, 130, 0.4); }
      50%      { box-shadow: 0 0 26px 7px rgba(255, 210, 130, 0.7); }
    }

    .room-caption {
      position: absolute; left: 0; right: 0; top: 0; z-index: 3;
      padding: 0.7rem 1.1rem; font-size: 1rem; font-weight: 600;
      background: linear-gradient(rgba(0,0,0,0.65), transparent); pointer-events: none;
    }
    .room-caption .view-hint { font-weight: 400; opacity: 0.7; font-size: 0.85rem; }
    .view-dots {
      position: absolute; left: 50%; bottom: 4rem; transform: translateX(-50%);
      z-index: 3; display: flex; gap: 0.45rem; pointer-events: none;
    }
    .view-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.35); }
    .view-dot.on { background: rgba(255, 220, 150, 0.95); }

    .journey-door {
      position: absolute; left: 50%; bottom: 1.4rem; transform: translateX(-50%);
      z-index: 4; cursor: pointer; font: inherit; font-weight: 600; font-size: 1rem;
      color: #10202a; background: rgba(255, 216, 140, 0.96);
      border: 0; border-radius: 999px; padding: 0.7rem 1.6rem;
      box-shadow: 0 0 22px 6px rgba(255, 205, 120, 0.6);
      animation: doorpulse 1.7s ease-in-out infinite;
    }
    .journey-door[hidden] { display: none; }
    @keyframes doorpulse {
      0%, 100% { box-shadow: 0 0 18px 5px rgba(255, 205, 120, 0.5); }
      50%      { box-shadow: 0 0 30px 9px rgba(255, 205, 120, 0.85); }
    }

    /* ----- the pop-up (clue text, or console + question) ----- */
    #node-detail.node-detail {
      position: fixed; inset: 0; z-index: 10; display: none;
      align-items: center; justify-content: center;
      background: rgba(4, 10, 14, 0.62); padding: 1.5rem;
    }
    #node-detail.node-detail.open { display: flex; }
    .modal-box {
      background: #0b1620; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 1.2rem 1.3rem;
      max-width: 560px; width: 100%; max-height: 88vh; overflow: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.55);
    }
    .modal-box.wide { max-width: 1000px; }
    .detail-back {
      background: none; border: 0; color: inherit; font: inherit;
      opacity: 0.75; cursor: pointer; margin-bottom: 0.7rem; padding: 0;
    }
    .detail-back:hover { opacity: 1; }
    .qa-grid { display: flex; gap: 1.2rem; align-items: flex-start; }
    .qa-console { flex: 1.5 1 0; min-width: 0; }
    .qa-question { flex: 1 1 0; min-width: 0; }
    .qa-console .console { margin: 0; }
    @media (max-width: 760px) { .qa-grid { flex-direction: column; } }

    #console-holder[hidden] { display: none; }

    /* finish as a centred overlay */
    #finish.finish {
      position: fixed; inset: 0; z-index: 11; display: none;
      align-items: center; justify-content: center;
      background: rgba(4, 10, 14, 0.7); padding: 1.5rem;
    }
    #finish.finish.show { display: flex; flex-direction: column; }
    #finish.finish > * { max-width: 560px; }
  </style>
</head>
<body>

  <!-- ===== Screen 1: the story ===== -->
  <section id="screen1" class="screen active">
    <div class="scene">
      <img id="scene-image" alt="" />
      <div class="scene-overlay">
        <div class="tagline" id="scenario-title">…</div>
        <h1 id="scene-heading">…</h1>
        <div id="scene-story" class="story"></div>

        <div class="entry">
          <label for="student-id">Your x500</label>
          <input id="student-id" type="text" autocomplete="off"
                 placeholder="e.g. bust0037" />
          <button id="enter-btn" class="primary">Enter →</button>
          <div id="id-error" class="error"></div>
        </div>
      </div>
    </div>
  </section>

  <audio id="ambience" preload="none"></audio>
  <button id="music-toggle" class="music-toggle">♪ on</button>

  <!-- ===== Screen 2: the station (full-screen) ===== -->
  <section id="screen2" class="screen">
    <div id="screen2-bg" class="screen2-bg"></div>

    <div class="map-wrap fullscreen">
      <div id="node-map" class="map"></div>
      <div id="node-detail" class="node-detail"></div>
    </div>

    <!-- The console lives here until a question pop-up borrows it. -->
    <div id="console-holder" hidden>
      <div id="briefing" class="briefing"></div>
      <div id="console-block" class="console">
        <div id="paste-banner" class="paste-banner">
          <span>Pasting a big chunk? Make sure you're not shortcutting your own
          learning — you'll remember this far better if you type it. (You can
          still paste.)</span>
          <button id="paste-dismiss">Got it</button>
        </div>
        <div class="console-label">R console</div>
        <textarea id="code-input" spellcheck="false"></textarea>
        <div class="console-bar">
          <button id="run-btn" class="primary">Run</button>
          <span id="webr-status" class="status">Loading…</span>
        </div>
        <div id="webr-output" class="output"></div>
      </div>
    </div>

    <div id="finish" class="finish">
      <h3>Case closed</h3>
      <div id="finish-body"></div>
      <div class="code-box">
        <div id="final-code" class="code">…</div>
        <button id="copy-code" class="primary">Copy code</button>
      </div>
    </div>
  </section>

  <script src="../shared/codec.js"></script>
  <script src="scenario.js"></script>
  <script type="module" src="../shared/escape-engine.js"></script>
</body>
</html>
