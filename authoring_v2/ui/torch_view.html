<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cinemagraph — torch flame region</title>
  <!-- 2D region composite test: a full-res STILL torch image with ONLY the flame box animated from a
       small high-res LTX loop (feathered). This is the small-fast-moving-thing test — judge whether a
       tight high-res region reads well against a crisp still. Flat image, so no 360 viewer needed. -->
  <style>
    html,body{margin:0;height:100%;background:#0a0f14;color:#e8eef2;font:14px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;}
    #wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    canvas{max-width:100%;max-height:100%;box-shadow:0 8px 40px rgba(0,0,0,.6);border-radius:6px;}
    #bar{height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0b1b28;border-top:1px solid rgba(255,255,255,.14);}
    button{background:transparent;color:#e8eef2;border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:6px 12px;font:inherit;cursor:pointer;}
    .ok2{color:#9fe6b5;} #stat{margin-left:auto;font-size:12px;opacity:.85;} b.k{color:#ffd88c;}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div id="bar">
    <span class="ok2">Only the <b class="k">flame</b> moves — the rest is the untouched still.</span>
    <button id="freeze">freeze motion</button>
    <button id="box">show region box</button>
    <span id="stat">loading…</span>
  </div>
  <video id="v" src="torch_flame.mp4" muted loop playsinline crossorigin="anonymous" style="display:none"></video>
  <script>
    const c = document.getElementById("c"), ctx = c.getContext("2d"), v = document.getElementById("v"), stat = document.getElementById("stat");
    let BOX = [0.30, 0.06, 0.70, 0.60], base = null, running = true, showBox = false, frames = 0, fpsT = 0, fps = 0;

    function draw() {
      const W = c.width, H = c.height;
      ctx.drawImage(base, 0, 0, W, H);                        // full-res still
      const [x0, y0, x1, y1] = BOX, bx = x0 * W, by = y0 * H, bw = (x1 - x0) * W, bh = (y1 - y0) * H;
      if (v.readyState >= 2 && bw > 0 && bh > 0) {
        const fc = document.createElement("canvas"); fc.width = Math.round(bw); fc.height = Math.round(bh);
        const fx = fc.getContext("2d");
        fx.drawImage(v, 0, 0, v.videoWidth, v.videoHeight, 0, 0, fc.width, fc.height);
        fx.globalCompositeOperation = "destination-in";       // feather edges → blends into the still
        const g = fx.createRadialGradient(fc.width/2, fc.height/2, Math.min(fc.width,fc.height)*0.12,
                                          fc.width/2, fc.height/2, Math.max(fc.width,fc.height)*0.62);
        g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(0.7, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
        fx.fillStyle = g; fx.fillRect(0, 0, fc.width, fc.height);
        ctx.drawImage(fc, bx, by);
      }
      if (showBox) { ctx.strokeStyle = "#7fd1ff"; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh); }
    }
    function loop(t) {
      if (running) {
        if (t - fpsT > 500) { fps = Math.round(frames * 1000 / (t - fpsT)); frames = 0; fpsT = t; }
        frames++; draw();
        stat.innerHTML = `<b class="k">${fps} fps</b> · still ${c.width}×${c.height} · flame ${v.videoWidth||"?"}×${v.videoHeight||"?"}`;
      }
      requestAnimationFrame(loop);
    }
    async function init() {
      try { const j = await (await fetch("torch_box.json")).json(); if (Array.isArray(j.box)) BOX = j.box; } catch (e) {}
      base = new Image();
      base.onload = () => { c.width = base.naturalWidth; c.height = base.naturalHeight; v.play().catch(()=>{}); draw(); requestAnimationFrame(loop); };
      base.onerror = () => stat.innerHTML = `<span style="color:#ff9b9b">still image not ready yet — run the pipeline first</span>`;
      base.src = "torch_base.png";
    }
    document.getElementById("freeze").onclick = e => { running = !running; e.target.textContent = running ? "freeze motion" : "resume motion"; };
    document.getElementById("box").onclick = e => { showBox = !showBox; e.target.textContent = showBox ? "hide region box" : "show region box"; if (!running) draw(); };
    init();
  </script>
</body>
</html>
